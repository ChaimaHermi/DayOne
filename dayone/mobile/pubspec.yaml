name: dayone
description: "DayOne - registre maternel numerique pour sages-femmes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Network (REST API)
  dio: ^5.11.1

  # Local storage (SQLite)
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # Device
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.3

  # Utils
  uuid: ^4.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
